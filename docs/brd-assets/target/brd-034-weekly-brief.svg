<svg viewBox="0 0 620 930" width="620" role="img" aria-label="The weekly compliance report: fourteen rules, each with its denominator, in Arabic and English" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<!-- One printable column, A4 width. Bilingual by construction: the English sits left-aligned and the
     Arabic right-aligned on the same rule, so the page reads correctly in either direction and neither
     language can drift into a second document. RTL: swap the two anchors; the rule id column moves right. -->
<rect x="0" y="0" width="620" height="930" fill="#ffffff"/><text x="32" y="40" font-size="15" font-weight="700" fill="#1c1a22">Weekly compliance — 14 rules</text><text x="588" y="40" text-anchor="end" font-size="14" fill="#1c1a22">‏تقرير الالتزام الأسبوعي — 14 قاعدة‏</text><text x="32" y="58" font-size="9.4" fill="#6f6b7d">Sunday 07:00 Asia/Riyadh</text><text x="588" y="58" text-anchor="end" font-size="9.4" fill="#6f6b7d">‏الأحد 07:00 بتوقيت الرياض‏</text><line x1="32" y1="68" x2="588" y2="68" stroke="#1c1a22" stroke-width="1.4"/><text x="32" y="86" font-size="9.6" fill="#4a4756">141 organizations × 11 use cases = 1,551 records. 497 live · 179 closed-only · 875 never written down.</text><text x="32" y="100" font-size="9.6" fill="#4a4756">Every line below carries its denominator. None of them is a percentage.</text><text x="588" y="114" text-anchor="end" font-size="9.4" fill="#4a4756">‏كل سطر يحمل مقامه، ولا سطر منها نسبة مئوية.‏</text><line x1="32" y1="126" x2="588" y2="126" stroke="#d8d5e0"/><rect x="32" y="132" width="556" height="46" fill="#faf9fc"/><text x="40" y="148" font-size="9.4" font-weight="700" fill="#6f6b7d">R1</text><text x="66" y="148" font-size="10" fill="#1c1a22">A pair carrying more than one open record</text><text x="580" y="148" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">26 of 744 pairs</text><text x="66" y="162" font-size="8.6" fill="#6f6b7d">resolves to: Assignee</text><text x="580" y="175" text-anchor="end" font-size="9.6" fill="#4a4756">‏زوج يحمل أكثر من سجل مفتوح — 26 من 744‏</text><line x1="32" y1="178" x2="588" y2="178" stroke="#ecebf1"/><text x="40" y="197" font-size="9.4" font-weight="700" fill="#6f6b7d">R2</text><text x="66" y="197" font-size="10" fill="#1c1a22">An open record naming no rung</text><text x="580" y="197" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">531 of 552 records</text><text x="66" y="211" font-size="8.6" fill="#6f6b7d">resolves to: Assignee</text><text x="580" y="224" text-anchor="end" font-size="9.6" fill="#4a4756">‏سجل مفتوح لا يذكر درجته — 531 من 552‏</text><line x1="32" y1="227" x2="588" y2="227" stroke="#ecebf1"/><rect x="32" y="230" width="556" height="46" fill="#faf9fc"/><text x="40" y="246" font-size="9.4" font-weight="700" fill="#6f6b7d">R3</text><text x="66" y="246" font-size="10" fill="#1c1a22">Two records with the same title, exactly</text><text x="580" y="246" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">37 titles over 77 tickets</text><text x="66" y="260" font-size="8.6" fill="#6f6b7d">resolves to: Account Manager</text><text x="580" y="273" text-anchor="end" font-size="9.6" fill="#4a4756">‏عنوانان متطابقان حرفياً — 37 عنواناً في 77 تذكرة‏</text><line x1="32" y1="276" x2="588" y2="276" stroke="#ecebf1"/><text x="40" y="295" font-size="9.4" font-weight="700" fill="#6f6b7d">R4</text><text x="66" y="295" font-size="10" fill="#1c1a22">On the ladder with no target date</text><text x="580" y="295" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">552 of 552 open records</text><text x="66" y="309" font-size="8.6" fill="#6f6b7d">resolves to: the automation account</text><text x="580" y="322" text-anchor="end" font-size="9.6" fill="#4a4756">‏على السلّم بلا تاريخ مستهدف — 552 من 552‏</text><line x1="32" y1="325" x2="588" y2="325" stroke="#ecebf1"/><rect x="32" y="328" width="556" height="46" fill="#faf9fc"/><text x="40" y="344" font-size="9.4" font-weight="700" fill="#6f6b7d">R5</text><text x="66" y="344" font-size="10" fill="#1c1a22">A rule that resolves to nobody</text><text x="580" y="344" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">42 of 141 organizations unowned</text><text x="66" y="358" font-size="8.6" fill="#6f6b7d">resolves to: PMO Lead</text><text x="580" y="371" text-anchor="end" font-size="9.6" fill="#4a4756">‏قاعدة لا تُسنَد إلى أحد — 42 منظمة من 141 بلا مالك‏</text><line x1="32" y1="374" x2="588" y2="374" stroke="#ecebf1"/><text x="40" y="393" font-size="9.4" font-weight="700" fill="#6f6b7d">R6</text><text x="66" y="393" font-size="10" fill="#1c1a22">Past the 10-day rung budget</text><text x="580" y="393" text-anchor="end" font-size="9.4" font-weight="700" fill="#6f6b7d">not measurable yet — no rung clock has fired</text><text x="66" y="407" font-size="8.6" fill="#6f6b7d">resolves to: —</text><text x="580" y="420" text-anchor="end" font-size="9.6" fill="#4a4756">‏تجاوز مهلة العشرة أيام — غير قابل للقياس بعد‏</text><line x1="32" y1="423" x2="588" y2="423" stroke="#ecebf1"/><rect x="32" y="426" width="556" height="46" fill="#faf9fc"/><text x="40" y="442" font-size="9.4" font-weight="700" fill="#6f6b7d">R7</text><text x="66" y="442" font-size="10" fill="#1c1a22">Quiet for 14 days</text><text x="580" y="442" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">312 of 497 records that have a clock</text><text x="66" y="456" font-size="8.6" fill="#6f6b7d">resolves to: Assignee</text><text x="580" y="469" text-anchor="end" font-size="9.6" fill="#4a4756">‏سجل صامت 14 يوماً — 312 من 497 لها ساعة‏</text><line x1="32" y1="472" x2="588" y2="472" stroke="#ecebf1"/><text x="40" y="491" font-size="9.4" font-weight="700" fill="#6f6b7d">R8</text><text x="66" y="491" font-size="10" fill="#1c1a22">Closed with no reason given</text><text x="580" y="491" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">370 of 370 closed onboarding tickets</text><text x="66" y="505" font-size="8.6" fill="#6f6b7d">resolves to: Account Manager</text><text x="580" y="518" text-anchor="end" font-size="9.6" fill="#4a4756">‏إغلاق بلا سبب مذكور — 370 من 370‏</text><line x1="32" y1="521" x2="588" y2="521" stroke="#ecebf1"/><rect x="32" y="524" width="556" height="46" fill="#faf9fc"/><text x="40" y="540" font-size="9.4" font-weight="700" fill="#6f6b7d">R9</text><text x="66" y="540" font-size="10" fill="#1c1a22">More than 10 days with CHI</text><text x="580" y="540" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">11 of 26 records at COC</text><text x="66" y="554" font-size="8.6" fill="#6f6b7d">resolves to: PMO Lead, who asks CHI</text><text x="580" y="567" text-anchor="end" font-size="9.6" fill="#4a4756">‏أكثر من 10 أيام لدى مركز الضمان الصحي — 11 من 26‏</text><line x1="32" y1="570" x2="588" y2="570" stroke="#ecebf1"/><text x="40" y="589" font-size="9.4" font-weight="700" fill="#6f6b7d">R10</text><text x="66" y="589" font-size="10" fill="#1c1a22">Flagged as blocked, waiting party unnamed</text><text x="580" y="589" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">2 of 2 flagged tickets</text><text x="66" y="603" font-size="8.6" fill="#6f6b7d">resolves to: Assignee</text><text x="580" y="616" text-anchor="end" font-size="9.6" fill="#4a4756">‏مؤشر تعثّر دون تحديد الطرف المنتظَر — 2 من 2‏</text><line x1="32" y1="619" x2="588" y2="619" stroke="#ecebf1"/><rect x="32" y="622" width="556" height="46" fill="#faf9fc"/><text x="40" y="638" font-size="9.4" font-weight="700" fill="#6f6b7d">R11</text><text x="66" y="638" font-size="10" fill="#1c1a22">A medication record still on the V1 default</text><text x="580" y="638" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">142 of 142 migrated cells</text><text x="66" y="652" font-size="8.6" fill="#6f6b7d">resolves to: Account Manager</text><text x="580" y="665" text-anchor="end" font-size="9.6" fill="#4a4756">‏سجل دواء ما زال على V1 الافتراضية — 142 من 142‏</text><line x1="32" y1="668" x2="588" y2="668" stroke="#ecebf1"/><text x="40" y="687" font-size="9.4" font-weight="700" fill="#6f6b7d">R12</text><text x="66" y="687" font-size="10" fill="#1c1a22">A record with no interface checklist</text><text x="580" y="687" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">550 of 552 open records</text><text x="66" y="701" font-size="8.6" fill="#6f6b7d">resolves to: Assignee</text><text x="580" y="714" text-anchor="end" font-size="9.6" fill="#4a4756">‏سجل بلا قائمة تحقق — 550 من 552‏</text><line x1="32" y1="717" x2="588" y2="717" stroke="#ecebf1"/><rect x="32" y="720" width="556" height="46" fill="#faf9fc"/><text x="40" y="736" font-size="9.4" font-weight="700" fill="#6f6b7d">R13</text><text x="66" y="736" font-size="10" fill="#1c1a22">A record naming no hospital</text><text x="580" y="736" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">531 of 552 open records</text><text x="66" y="750" font-size="8.6" fill="#6f6b7d">resolves to: Account Manager</text><text x="580" y="763" text-anchor="end" font-size="9.6" fill="#4a4756">‏سجل لا يسمّي مستشفى — 531 من 552‏</text><line x1="32" y1="766" x2="588" y2="766" stroke="#ecebf1"/><text x="40" y="785" font-size="9.4" font-weight="700" fill="#6f6b7d">R14</text><text x="66" y="785" font-size="10" fill="#1c1a22">A ticket re-titled into the record convention</text><text x="580" y="785" text-anchor="end" font-size="9.4" font-weight="700" fill="#1c1a22">0 in the period, of 2,049 outside the record</text><text x="66" y="799" font-size="8.6" fill="#6f6b7d">resolves to: PMO Lead</text><text x="580" y="812" text-anchor="end" font-size="9.6" fill="#4a4756">‏تذكرة أُعيدت تسميتها لتبدو سجلاً — 0 خلال الفترة، من 2,049 خارج السجل‏</text><line x1="32" y1="815" x2="588" y2="815" stroke="#ecebf1"/><line x1="32" y1="842" x2="588" y2="842" stroke="#1c1a22" stroke-width="1.2"/><text x="32" y="860" font-size="9" fill="#4a4756">A rule that resolves to nobody is printed as R5, not dropped. A rule that cannot be computed is printed as</text><text x="32" y="873" font-size="9" fill="#4a4756">not measurable yet, never as zero. An unrecorded fact is not a measurement of nothing.</text><text x="588" y="890" text-anchor="end" font-size="9" fill="#4a4756">‏القاعدة التي لا تُسنَد إلى أحد تُطبع باسم R5 ولا تُحذف، وما لا يمكن قياسه يُكتب كذلك لا صفراً.‏</text><text x="32" y="912" font-size="8.6" fill="#8a5a00">Sent in Arabic and English as one message — never as a second document that drifts.</text>
</svg>