ns</text><text x="468" y="162" font-size="8.6" fill="#6f6b7d">holding 203 of the 875 pairs</text><text x="468" y="175" font-size="8.6" fill="#6f6b7d">nobody has written down</text><rect x="672" y="100" width="204" height="96" rx="5" fill="#ffffff" stroke="#d8d5e0" stroke-width="1"/><text x="684" y="119" font-size="9.6" font-weight="700" fill="#1c1a22">Gone quiet — 14 days</text><text x="684" y="145" font-size="22" font-weight="700" fill="#1c1a22">312</text><text x="723" y="145" font-size="9.6" fill="#4a4756">of 497 records with a clock</text><text x="684" y="162" font-size="8.6" fill="#6f6b7d">1,054 excluded: no person has</text><text x="684" y="175" font-size="8.6" fill="#6f6b7d">touched them, so nothing is counting</text><text x="24" y="226" font-size="12" font-weight="700" fill="#1c1a22">The exception list — 48 of 1,551 records</text><text x="876" y="226" text-anchor="end" font-size="9.5" fill="#6f6b7d">‏قائمة الاستثناءات‏</text><line x1="24" y1="252" x2="876" y2="252" stroke="#d8d5e0"/><text x="24" y="246" font-size="8.8" font-weight="700" fill="#6f6b7d">Organization</text><text x="248" y="246" font-size="8.8" font-weight="700" fill="#6f6b7d">Use case</text><text x="392" y="246" font-size="8.8" font-weight="700" fill="#6f6b7d">Rung</text><text x="470" y="246" font-size="8.8" font-weight="700" fill="#6f6b7d">Why it is here</text><text x="700" y="246" font-size="8.8" font-weight="700" fill="#6f6b7d">Waiting on</text><rect x="24" y="259" width="852" height="24" fill="#faf9fc"/><text x="24" y="275" font-size="9.6" fill="#1c1a22">King Fahad Medical City</text><text x="248" y="275" font-size="9.6" fill="#4a4756">Lab Result</text><line x1="392" y1="272" x2="431" y2="272" stroke="#dcd8e6" stroke-width="2.6" stroke-linecap="round"/><circle cx="392" cy="272" r="1.4" fill="#a8a3b8"/><circle cx="405" cy="272" r="1.4" fill="#a8a3b8"/><circle cx="418" cy="272" r="1.4" fill="#a8a3b8"/><circle cx="431" cy="272" r="1.4" fill="#a8a3b8"/><line x1="392" y1="272" x2="405" y2="272" s