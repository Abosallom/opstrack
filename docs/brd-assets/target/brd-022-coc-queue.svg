body has said yet</text><line x1="24" y1="264" x2="876" y2="264" stroke="#d8d5e0"/><text x="24" y="280" font-size="9" fill="#6f6b7d">Days with CHI is counted, never judged: no row here carries a warning colour, because the party being waited on is outside the programme.</text><text x="24" y="294" font-size="9" fill="#6f6b7d">An empty cell reads “nobody has said yet”, which is not a zero and not a fault.</text><rect x="24" y="306" width="852" height="240" rx="6" fill="#ffffff" stroke="#d8d5e0"/><line x1="450" y1="306" x2="450" y2="546" stroke="#ececf2"/><text x="42" y="330" font-size="12" font-weight="700" fill="#1c1a22">King Fahad Medical City · ADT</text><text x="42" y="346" font-size="10" fill="#6f6b7d">‏مدينة الملك فهد الطبية · تبادل بيانات الدخول والخروج‏</text><line x1="42" y1="368" x2="252" y2="368" stroke="#dcd8e6" stroke-width="4" stroke-linecap="round"/><line x1="42" y1="368" x2="182" y2="368" stroke="#1c1a22" stroke-width="4" stroke-linecap="round"/><circle cx="42" cy="368" r="2" fill="#a8a3b8"/><text x="42" y="384" text-anchor="middle" font-size="8.2" font-weight="600" fill="#4a4756">DEV</text><circle cx="112" cy="368" r="2" fill="#a8a3b8"/><text x="112" y="384" text-anchor="middle" font-size="8.2" font-weight="600" fill="#4a4756">STG/TEST</text><circle cx="182" cy="368" r="2" fill="#a8a3b8"/><text x="182" y="384" text-anchor="middle" font-size="8.2" font-weight="600" fill="#4a4756">COC</text><circle cx="252" cy="368" r="2" fill="#a8a3b8"/><text x="252" y="384" text-anchor="middle" font-size="8.2" font-weight="600" fill="#4a4756">PROD</text><circle cx="182" cy="368" r="5.4" fill="#1c1a22" stroke="#ffffff" stroke-width="1.5"/><text x="42" y="414" font-size="8.6" font-weight="700" fill="#6f6b7d">coc_submitted_on</text><text x="42" y="429" font-size="11" fill="#1c1a22">14 Jul 2026</text><text x="42" y="442" font-size="8.4" fill="#6f6b7d">recorded by A. Alsaloom · 43 days ago</text><text x="42" y="458" font-size="8.6" font-weight="700" fill="#6f6b7d">coc_contact</text><text x="42" y="473" font-size="11" fill="#1c1a22">Faisal Al-Otaibi</text><text x="42" y="486" font-size="8.4" fill="#6f6b7d">a name and nothing else — no email, no phone, no title</text><text x="42" y="502" font-size="8.6" font-weight="700" fill="#6f6b7d">coc_reference</text><text x="42" y="517" font-size="11" fill="#1c1a22">CHI-COC-2026-0412</text><text x="42" y="530" font-size="8.4" fill="#6f6b7d">the certificate for this exact pair; a sibling use case never promotes this one</text><text x="470" y="330" font-size="11" font-weight="700" fill="#1c1a22">The chase — entry_updates, append-only</text><text x="858" y="330" text-anchor="end" font-size="10" fill="#6f6b7d">‏سجل المتابعة‏</text><line x1="470" y1="352" x2="470" y2="386" stroke="#e0dce9" stroke-width="2"/><circle cx="470" cy="360" r="3" fill="#1c1a22"/><text x="482" y="363" font-size="8.6" fill="#6f6b7d">22 Aug 2026 · 09:12 · <tspan fill="#4a4756" font-weight="700">A. Alsaloom</tspan></text><text x="482" y="377" font-size="9.6" fill="#1c1a22">Called CHI. The certificate is with the reviewer.</text><line x1="470" y1="392" x2="470" y2="426" stroke="#e0dce9" stroke-width="2"/><circle cx="470" cy="400" r="3" fill="#1c1a22"/><text x="482" y="403" font-size="8.6" fill="#6f6b7d">12 Aug 2026 · 11:40 · <tspan fill="#4a4756" font-weight="700">A. Alsaloom</tspan></text><text x="482" y="417" font-size="9.6" fill="#1c1a22">Second follow-up sent to the CHI contact.</text><line x1="470" y1="432" x2="470" y2="466" stroke="#e0dce9" stroke-width="2"/><circle cx="470" cy="440" r="3" fill="#1c1a22"/><text x="482" y="443" font-size="8.6" fill="#6f6b7d">02 Aug 2026 · 08:05 · <tspan fill="#4a4756" font-weight="700">A. Alsaloom</tspan></text><text x="482" y="457" font-size="9.6" fill="#1c1a22">Submitted the pack to CHI; reference issued.</text><rect x="470" y="478" width="388" height="26" rx="4" fill="#fbfafd" stroke="#cfcbdb" stroke-dasharray="3 3"/><text x="482" y="495" font-size="9.4" fill="#6f6b7d">Add a chase note — it is signed with your name and the time</text><rect x="470" y="512" width="232" height="28" rx="4" fill="#1f7a4d"/><text x="586" y="530" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Record that CHI signed → PROD</text><text x="712" y="525" font-size="8.4" fill="#8a5a00">PMO only. An OB Account Manager moves</text><text x="712" y="536" font-size="8.4" fill="#8a5a00">DEV → STG/TEST → COC; this rung notifies.</text><text x="24" y="562" font-size="8.8" fill="#6f6b7d">Writes one row in map_node_use_cases and one row in entry_updates, both carrying the author who typed them — never a service-role script, so the stage clock counts.</text>
