name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a run that may be inside deploy-pages: cancelling there can
  # wedge the Pages deployment, and the NEXT push then fails on the stuck lock.
  # Queued runs simply supersede each other instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Added at the Wave-1 close, and it is the gate the locale parity check
      # actually lives or dies by. Until now `npm run test` ran only on whoever
      # remembered to type it, which is precisely the kind of check that quietly
      # stops running — and en/ar parity, the frozen unions and the parser's
      # totality proof are all asserted nowhere else. Placed before the build so
      # a red suite costs 20 seconds rather than a full Vite run.
      - run: npm run test
      # Fail fast if the secrets are absent. Without this check a missing secret
      # produces a SUCCESSFUL deploy of a "not configured" build — the worst
      # failure mode, because nothing looks wrong until someone tries to sign in.
      - name: Require Supabase secrets
        run: |
          test -n "${{ secrets.VITE_SUPABASE_URL }}" || { echo "::error::VITE_SUPABASE_URL secret is not set"; exit 1; }
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" || { echo "::error::VITE_SUPABASE_ANON_KEY secret is not set"; exit 1; }
      - run: npm run build
        env:
          # Repository secrets. Vite inlines these at build time, so they must be
          # present here and not at deploy time. The anon key is public by
          # design — RLS is the boundary — but keeping it in secrets means
          # rotating the Supabase project does not need a code change.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Deliberately NOT in the required-secrets check above: unset is the
          # normal state, and src/lib/push.ts falls back to the key compiled into
          # the bundle. It is here so that rotating the VAPID pair is a
          # `gh secret set` and a re-run rather than a source edit — which is
          # what the comment on DEFAULT_VAPID_PUBLIC_KEY promises, and could not
          # deliver while this line was missing. RUNBOOK §4.2.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      # The custom domain lives in the ARTIFACT, not in the repo's Pages setting.
      # With `build_type: workflow` GitHub reads CNAME out of each deployed tree,
      # so a build that drops the file silently un-sets nphiescore.com and the
      # site reverts to abosallom.github.io/opstrack/ — a "successful" deploy that
      # moves the app back onto the shared origin src/api/supabase.ts exists to
      # get it off. Vite copies public/ verbatim; this proves it did.
      - name: Require the CNAME in the artifact
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing - the custom domain would be un-set"; exit 1; }
          grep -qx 'nphiescore.com' dist/CNAME || { echo "::error::dist/CNAME does not read nphiescore.com"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
