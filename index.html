<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CoreTrack — capture actions, assign owners, and see what has gone stale across every track." />
    <!-- Kept in sync with the active theme at runtime by src/lib/theme.ts so the
         installed PWA's status bar matches the app instead of always being dark. -->
    <meta name="theme-color" content="#101215" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CoreTrack" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>CoreTrack — Multi-Track Action Tracker</title>
  </head>
  <body>
    <!-- lang and dir above are the pre-hydration defaults; main.tsx overwrites
         both from the persisted locale before first paint of the app shell. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
